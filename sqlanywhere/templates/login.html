{% extends "base.html" %}
{% block body %}
    <div id="modal_login" class="modal" style="text-align: center">
        <div class="modal-content" style="max-height: available; max-width: available">
            <form class="login-form" method="post">
                <div class="row">
                    <div class="input-field col s11">
                        <i class="material-icons prefix">account_circle</i>
                        <input name="codigo" class="validate" id="codigo" type="number">
                        <label for="codigo" data-error="wrong" data-success="right">Codigo</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s11">
                        <i class="material-icons prefix">badge</i>
                        <input name="cnpj_cpf" id="cnpj_cpf" type="number">
                        <label for="cnpj_cpf">CNPJ/CPF</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12">
                        <button class="btn waves-effect waves-light s12" style="width: 100%; font-size: x-large; height: 2em" type="submit" name="action">Login</button>
                    </div>
                    {% if erro %}
                        <div class="col s12 m12 l12" style="background-color: indianred">
                            Credenciais inválidas
                        </div>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="../static/script_login.js"></script>
{% endblock %}
